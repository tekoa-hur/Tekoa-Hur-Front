name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

jobs:
  ci-process:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: npm install

      # Ejecuta los tests y genera la cobertura
      - name: Ejecutar tests con cobertura
        run: npm run test -- --run --coverage

      # Al estar dentro del flujo lineal sin dependencias de jobs, el parser no se bloquea
      - name: Subir reporte a Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: tekoa-hur/Tekoa-Hur-Front

      # El build se hace justo después en el mismo entorno limpio
      - name: Build
        run: npm run build