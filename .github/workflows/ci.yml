name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

       - name: Instalar dependencias
        run: npm install

      - name: Ejecutar tests
        run: npm run test -- --run

      - name: Build
        run: npm run build